# Autoriza explicitamente los scripts de instalacion (postinstall/preinstall)
# de las dependencias que los necesitan. pnpm los bloquea por defecto como
# medida de seguridad frente a ataques de supply-chain.
#
#  better-sqlite3    -> modulo nativo en C++, compila/descarga su binario
#  esbuild           -> descarga el binario nativo que usa vitest/vite
#  prisma            -> CLI, prepara sus binarios
#  @prisma/engines   -> descarga los motores de consulta de Prisma
#  bcrypt            -> modulo nativo en C++ para el hash de contrasenas
allowBuilds:
  better-sqlite3: true
  esbuild: true
  prisma: true
  '@prisma/engines': true
  bcrypt: true
